<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Abdur Rahim Naik — Turning Ideas Into Impact</title>
  <desc id="d">Banner for graphic designer Abdur Rahim Naik: graphic design, brand identity and creative technology, with abstract geometric shapes on a dark navy background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#151B33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1500" height="500" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1500" height="500" fill="url(#bg)"/>
    <rect width="1500" height="500" fill="url(#grid)"/>

    <!-- Abstract geometry (right side) -->
    <circle cx="1230" cy="250" r="190" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.55"/>
    <circle cx="1230" cy="250" r="130" fill="url(#violet)" fill-opacity="0.85"/>
    <rect x="1120" y="140" width="220" height="220" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2" transform="rotate(14 1230 250)"/>
    <circle cx="1390" cy="95" r="54" fill="#FF6B5E"/>
    <path d="M980 430 L1060 330 L1140 430 Z" fill="url(#emerald)" fill-opacity="0.9"/>
    <circle cx="1030" cy="110" r="14" fill="#10B981"/>
    <circle cx="1425" cy="420" r="26" fill="none" stroke="#FF6B5E" stroke-width="3"/>

    <!-- Design-tool inspired: bezier handles -->
    <g transform="translate(140 -20)">
    <path d="M900 330 C 960 230, 1040 250, 1100 170" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>
    <line x1="900" y1="330" x2="940" y2="290" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <rect x="893" y="323" width="14" height="14" fill="#0B1020" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="1093" y="163" width="14" height="14" fill="#0B1020" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="940" cy="290" r="6" fill="#3B82F6"/>
    </g>

    <!-- Color swatches -->
    <g transform="translate(90 400)">
      <rect width="44" height="44" rx="12" fill="#10B981"/>
      <rect x="58" width="44" height="44" rx="12" fill="#3B82F6"/>
      <rect x="116" width="44" height="44" rx="12" fill="#8B5CF6"/>
      <rect x="174" width="44" height="44" rx="12" fill="#FF6B5E"/>
    </g>

    <!-- Text -->
    <rect x="90" y="92" width="64" height="6" rx="3" fill="url(#accent)"/>
    <text x="90" y="178" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="3" fill="#FFFFFF">ABDUR RAHIM NAIK</text>
    <text x="90" y="256" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="600" fill="#34D399">Turning Ideas Into Impact</text>
    <text x="90" y="318" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="4" fill="#CBD5E1">GRAPHIC DESIGN • BRAND IDENTITY • CREATIVE TECHNOLOGY</text>
  </g>
</svg>
